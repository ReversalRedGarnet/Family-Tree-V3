name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # A project site is served from /<repo-name>/, so Vite needs that as
        # its base or every asset URL 404s and you get a white screen.
        # GITHUB_REPOSITORY is "owner/repo"; strip the owner off the front.
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Building with base path: /$REPO_NAME/"
          VITE_BASE_PATH="/$REPO_NAME/" npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
