name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job below gets the Pages permissions
# it needs to publish.
permissions:
  contents: read

# One deploy at a time. A newer push queues behind an in-flight one rather
# than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the repo's Pages settings.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # jsdom (used by the hook tests) needs Node >= 22.22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        # A failing test stops here, so nothing broken gets deployed.
        run: npm test

      - name: Build
        # A project site is served from /<repo-name>/, so Vite needs that as
        # its base or every asset URL 404s and you get a white screen. A user
        # or organisation site (a repo named <owner>.github.io) is served
        # from the root instead.
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO_NAME,,}" = "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPO_NAME/"
          fi
          echo "Building with base path: $BASE_PATH"
          VITE_BASE_PATH="$BASE_PATH" npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Required for actions/deploy-pages to publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
